{{- include "operator.pipelinesValidate" . -}}
{{- if or (ne .Values.operator.name "openshift-pipelines-operator-rh") (eq .Values.components.pipelines.mode "managed") }}
{{- if .Values.operatorgroup.create }}
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ template "common.names.fullname" . }}
  generateName: {{ template "common.names.fullname" . }}-
  namespace: {{ template "common.names.namespace" $ }}
  labels:
    {{- include "common.labels.labels" . | nindent 4 }}
  {{- if .Values.operatorgroup.annotations }}
  annotations:
    {{- toYaml .Values.operatorgroup.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.operatorgroup.allNamespaces }}
  targetNamespaces:
    - {{ template "common.names.namespace" . }}
  {{- end }}
{{- end }}
{{- end }}
