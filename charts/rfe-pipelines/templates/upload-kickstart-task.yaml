apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  namespace: {{ template "common.names.namespace" $ }}
  labels:
    {{- include "common.labels.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.commonCR.annotations | nindent 4 }}
  name: upload-kickstart
spec:
  workspaces:
    - name: workspace
  params:
    - name: ostree-repo-url
      description: URL of the OSTree Repository
    - name: kickstart-path
      description: Directory containing kickstart file
      type: string
    - name: kickstart-destination-dir
      description: Directory Kickstart file should be created
      type: string
    - name: extra-ansible-variables
      description: Extra Ansible variables
      default: ""
      type: string
  results:
    - name: artifact-repository-storage-url
      description: Location where the asset is stored in the artifact repository
    - name: serving-storage-url
      description: Location where the asset is served
  steps:
    - name: upload-kickstart-playbook
      image: {{ .Values.ansibleRunner.image | quote }}
      workingDir: /workspace/workspace
      args:
        - |-
          cd tooling/ansible
          ansible-galaxy collection install -r collections/requirements.yaml
          ansible-playbook \
            -e ostree_repo_url=$(params.ostree-repo-url) \
            -e kickstart_file=$(params.kickstart-path) \
            -e kickstart_destination_dir=$(params.kickstart-destination-dir) \
            -e nexus_credentials_secret_name={{ .Values.publicationEndpoints.artifactRepository.nexus.credentialsSecretName | quote }} \
            -e nexus_credentials_secret_namespace={{ .Values.publicationEndpoints.artifactRepository.nexus.credentialsSecretNamespace | quote }} \
            -e nexus_rfe_kickstarts_repository={{ .Values.publicationEndpoints.artifactRepository.nexus.kickstartRepository | quote }} \
            -e nexus_http_scheme={{ .Values.publicationEndpoints.artifactRepository.nexus.httpScheme | quote }} \
            -e nexus_service_name={{ .Values.publicationEndpoints.artifactRepository.nexus.serviceName | quote }} \
            -e nexus_service_port={{ .Values.publicationEndpoints.artifactRepository.nexus.servicePort | quote }} \
            -e nexus_route_name={{ .Values.publicationEndpoints.artifactRepository.nexus.routeName | quote }} \
            -e nexus_route_namespace={{ .Values.publicationEndpoints.artifactRepository.nexus.routeNamespace | quote }} \
            -e skip_nexus_upload={{ eq .Values.publicationEndpoints.artifactRepository.mode "disabled" | quote }} \
            -e artifact_repository_disabled_result_value={{ .Values.publicationEndpoints.artifactRepository.disabledResultValue | quote }} \
            -e httpd_route_name={{ .Values.publicationEndpoints.httpServing.routeName | quote }} \
            -e httpd_route_namespace={{ .Values.publicationEndpoints.httpServing.routeNamespace | quote }} \
            -e httpd_pod_namespace={{ .Values.publicationEndpoints.httpServing.podNamespace | quote }} \
            -e httpd_pod_label_selector={{ .Values.publicationEndpoints.httpServing.podLabelSelector | quote }} \
            -e httpd_html_dir={{ .Values.publicationEndpoints.httpServing.webRoot | quote }} \
            -e artifact_repository_url_output_file=$(results.artifact-repository-storage-url.path) \
            -e storage_url_output_file=$(results.serving-storage-url.path) \
            $(params.extra-ansible-variables) \
            playbooks/upload-kickstart.yaml
      command:
        - /bin/bash
        - -c
