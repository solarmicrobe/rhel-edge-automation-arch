apiVersion: tekton.dev/v1
kind: Task
metadata:
  namespace: {{ template "common.names.namespace" $ }}
  labels:
    {{- include "common.labels.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.commonCR.annotations | nindent 4 }}
  name: rfe-oci-publish-content
spec:
  workspaces:
    - name: workspace
  params:
    - name: image-path
      description: Path to RFE Container Image
    - name: image-tag
      description: Tag Associated with the RFE Image to Deploy
    - name: skip-free-space-protection
      description: Instruct OSTree to skip its free space protection
    - name: ostree-ref
      description: OSTree ref to mirror from the staged content
      default: {{ .Values.rhelTarget.imageBuilder.ostreeRef | quote }}
      type: string
  results:
    - name: content-path
      description: URL to OSTree Content
  steps:
    - name: publish-content-playbook
      image: {{ .Values.ansibleRunner.image | quote }}
      workingDir: /workspace/workspace
      args:
        - |-
          cd tooling/ansible
          ansible-galaxy collection install -r collections/requirements.yaml
          ansible-playbook \
            -e quay_image_path=$(params.image-path) \
            -e quay_image_tag=$(params.image-tag) \
            -e skip_free_space_protection=$(params.skip-free-space-protection) \
            -e httpd_web_root={{ .Values.publicationEndpoints.httpServing.webRoot | quote }} \
            -e httpd_route_name={{ .Values.publicationEndpoints.httpServing.routeName | quote }} \
            -e httpd_route_namespace={{ .Values.publicationEndpoints.httpServing.routeNamespace | quote }} \
            -e ostree_ref=$(params.ostree-ref) \
            -e content_path_output_file=$(results.content-path.path) \
            playbooks/oci-publish-content.yaml
      command:
        - /bin/bash
        - -c
