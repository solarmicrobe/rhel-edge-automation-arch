{{- include "rfePipelines.validate" . -}}
{{- if eq (include "rfePipelines.workflow" (dict "Values" .Values "name" "publishIso")) "true" -}}
{{- $httpServing := .Values.publicationEndpoints.httpServing -}}
{{- if eq .Values.components.httpd.mode "byo" -}}{{- $httpServing = .Values.components.httpd.connection -}}{{- end -}}
{{- $nexus := .Values.publicationEndpoints.artifactRepository.nexus -}}
{{- if eq .Values.components.nexus.mode "byo" -}}{{- $nexus = .Values.components.nexus.connection -}}{{- end -}}
{{- $upload := eq (include "rfePipelines.nexusUpload" .) "true" -}}
apiVersion: tekton.dev/v1
kind: Task
metadata:
  namespace: {{ template "common.names.namespace" $ }}
  labels:
    {{- include "common.labels.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.commonCR.annotations | nindent 4 }}    
  name: rfe-oci-build-auto-iso
spec:
  workspaces:
    - name: workspace
  params:
    - name: build-commit-id
      description: Commit ID of the RFE Installer Build
      type: string
    - name: image-builder-host
      description: Image Builder Host used for Pipeline Run
      type: string
    - name: image-builder-secret
      description: Name of the Secret Containing the SSH Key for the Image Builder Host
      default: {{ if eq .Values.components.imageBuilderVM.mode "byo" }}{{ .Values.components.imageBuilderVM.connection.sshSecretName | quote }}{{ else }}"image-builder-ssh-key"{{ end }}
      type: string
    - name: kickstart-url
      description: URL Containing the Kickstart File
      type: string
  results:
    - name: iso-url
      description: URL Containing the Autobooting Image
  steps:
    - name: build-auto-iso-playbook
      image: {{ .Values.ansibleRunner.image | quote }}
      workingDir: /workspace/workspace
      args:
        - |-
          cd tooling/ansible
          ansible-galaxy collection install -r collections/requirements.yaml
          ansible-playbook \
            -u cloud-user \
            --private-key=/var/secrets/image-builder-ssh/ssh-privatekey \
            -e kickstart_url=$(params.kickstart-url) \
            -e build_commit_id=$(params.build-commit-id) \
            -e image_builder_host=$(params.image-builder-host) \
{{- if $upload }}
            -e nexus_credentials_secret_name={{ $nexus.credentialsSecretName | quote }} \
            -e nexus_credentials_secret_namespace={{ $nexus.credentialsSecretNamespace | quote }} \
            -e nexus_repository={{ $nexus.autoIsoRepository | quote }} \
            -e nexus_http_scheme={{ $nexus.httpScheme | quote }} \
            -e nexus_service_name={{ $nexus.serviceName | quote }} \
            -e nexus_service_port={{ $nexus.servicePort | quote }} \
{{- end }}
            -e skip_nexus_upload={{ not $upload | quote }} \
{{- if or (eq .Values.components.httpd.mode "byo") (ne $httpServing.podNamespace "rfe") (ne $httpServing.podLabelSelector "deployment=httpd") (ne $httpServing.webRoot "/var/www/html") }}
            -e httpd_pod_namespace={{ $httpServing.podNamespace | quote }} \
            -e httpd_pod_label_selector={{ $httpServing.podLabelSelector | quote }} \
            -e httpd_web_root={{ $httpServing.webRoot | quote }} \
{{- end }}
            -e httpd_route_name={{ $httpServing.routeName | quote }} \
            -e httpd_route_namespace={{ $httpServing.routeNamespace | quote }} \
            -e iso_url_output_file=$(results.iso-url.path) \
            playbooks/oci-build-auto-iso.yaml
      command:
        - /bin/bash
        - -c
      volumeMounts:
        - name: image-builder-ssh
          mountPath: /var/secrets/image-builder-ssh
          readOnly: true
  volumes:
    - name: image-builder-ssh
      secret:
        defaultMode: 0440
        secretName: "$(params.image-builder-secret)"

{{- end -}}
