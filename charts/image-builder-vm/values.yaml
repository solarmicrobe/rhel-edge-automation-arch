rhel:
  version: "8.5"

rhelTarget:
  major: 8
  architecture: x86_64
  imageBuilder:
    enabled: true
    repositories:
      - rhel-8-for-x86_64-appstream-rpms
      - rhel-8-for-x86_64-baseos-rpms
  imageMode:
    enabled: false

imageDownloaderJob:
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  activeDeadlineSeconds: 600

ansibleVM:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  activeDeadlineSeconds: 1800

ansibleRunner:
  image: image-registry.openshift-image-registry.svc:5000/rfe/ansible-rfe-runner:latest
  imagePullPolicy: Always

imageBuilderVM:
  # Supported values:
  # - datasource: modern default; boot from an OpenShift Virtualization DataSource.
  # - pvc: legacy/reference path; requires legacyPvcSource.enabled=true.
  dataVolumeSource: datasource
  dataSource:
    name: rhel8
    namespace: openshift-virtualization-os-images
  legacyPvcSource:
    enabled: false
    repositoryUrl: http://nexus:8081/repository/rfe-rhel-media
  labels:
    app: image-builder
    workload.template.kubevirt.io/server: "true"
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    description: RHEL 8 With Image Builder
  template:
    labels:
      app: image-builder
      workload.template.kubevirt.io/server: "true"
  machine:
    type: pc-q35-rhel8.4.0
  cores: 2
  memory: 6Gi
  disk: 150Gi
  replicas: 1
  volumeMode: Filesystem

gitRepository: https://github.com/redhat-cop/rhel-edge-automation-arch.git
gitBranch: main
