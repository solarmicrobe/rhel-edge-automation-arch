# Optional Plan 0007 values: deployment.mode, permissions.mode, components.gitops
# (mode and connection). Omitted deployment mode resolves to managed-rfe-argocd.
# Ownership values are forwarded to the first component set and nested managers.
argocd:
  target:
    namespace: ""
    project: ""
    server: ""
  server: https://kubernetes.default.svc
  project: default
  retry:
    # number of failed sync attempt retries; unlimited number of attempts if less than 0
    limit: -1
    backoff:
      #  the amount to back off. Default unit is seconds, but could also be a duration (e.g. "2m", "1h")
      duration: 5s
      #  a factor to multiply the base duration after each failed retry
      factor: 2
      #  the maximum amount of time allowed for the backoff strategy
      maxDuration: 3m
