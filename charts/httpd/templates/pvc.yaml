{{- include "httpd.httpdValidate" (dict "httpd" .Values.components.httpd "endpoint" (dig "httpServing" dict (default dict .Values.publicationEndpoints)) "consumer" false) -}}
{{- if eq .Values.components.httpd.mode "managed" -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ template "common.names.fullname" . }}
  namespace: {{ template "common.names.namespace" $ }}
  labels:
    {{- include "common.labels.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  volumeMode: Filesystem

{{- end -}}
