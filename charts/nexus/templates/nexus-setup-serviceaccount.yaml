{{- include "nexus.nexusValidate" (dict "nexus" .Values.components.nexus "consumer" false) -}}
{{- if eq .Values.components.nexus.mode "managed" }}
{{- $setupJobName := include "common.names.appendSuffix" (dict "suffix" "setup" "context" $) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $setupJobName }}
  namespace: {{ template "common.names.namespace" $ }}
  labels:
    {{- include "common.labels.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.setupJob.annotations | nindent 4}}

{{- end }}
