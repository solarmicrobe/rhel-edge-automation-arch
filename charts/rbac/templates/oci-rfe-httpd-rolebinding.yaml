{{- if and (eq (include "rbac.owned" .) "true") (eq (include "rbac.workflow" (dict "Values" .Values "name" "stageImage")) "true") -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oci-rfe-httpd-rolebinding
  namespace: {{ include "rbac.stageNamespace" $ }}
  labels:
    {{- include "common.labels.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "rbac.stageName" $ }}
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: oci-rfe-httpd-role

{{- end -}}
