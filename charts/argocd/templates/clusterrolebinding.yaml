{{- include "argocd.validatePlan0007" . -}}
{{- if eq (include "argocd.renderLegacyClusterAdmin" .) "true" }}
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ template "common.names.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ template "common.names.fullname" . }}-argocd-application-controller
    namespace: {{ dig "gitops" "connection" "namespace" "" (default dict .Values.components) | default (include "common.names.namespace" .) }}
  - kind: ServiceAccount
    name: {{ template "common.names.fullname" . }}-argocd-applicationset-controller
    namespace: {{ dig "gitops" "connection" "namespace" "" (default dict .Values.components) | default (include "common.names.namespace" .) }}
  - kind: ServiceAccount
    name: {{ template "common.names.fullname" . }}-argocd-server
    namespace: {{ dig "gitops" "connection" "namespace" "" (default dict .Values.components) | default (include "common.names.namespace" .) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
{{- end }}
