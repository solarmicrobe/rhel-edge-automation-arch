{{- include "argocd-integration.validateNamespaceGrants" . -}}
{{- if .Values.argocd.access.namespaceGrants.create }}
{{- range $namespace := .Values.argocd.access.namespaceGrants.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "argocd-integration.namespaceGrantName" $ }}
  namespace: {{ $namespace }}
  labels:
    {{- include "argocd-integration.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "argocd-integration.namespaceGrantName" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.argocd.access.namespaceGrants.controllerServiceAccount }}
    namespace: {{ include "argocd-integration.namespaceGrantControllerNamespace" $ }}
{{- end }}
{{- end }}
