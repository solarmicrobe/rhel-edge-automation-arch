{{- include "argocd-integration.validateClusterCapabilities" . -}}
{{- if .Values.argocd.access.clusterCapabilities.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "argocd-integration.clusterCapabilityName" . }}
  labels:
    {{- include "argocd-integration.labels" . | nindent 4 }}
rules:
{{- if has "namespaces" .Values.argocd.access.clusterCapabilities.capabilities }}
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "argocd-integration.clusterCapabilityName" . }}
  labels:
    {{- include "argocd-integration.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "argocd-integration.clusterCapabilityName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.argocd.access.clusterCapabilities.controllerServiceAccount }}
    namespace: {{ include "argocd-integration.clusterCapabilityControllerNamespace" . }}
{{- end }}
