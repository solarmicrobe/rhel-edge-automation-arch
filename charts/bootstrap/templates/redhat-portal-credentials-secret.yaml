{{- with .Values.rhsm }}
{{- if and .portal (not .portal.secretProvided) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .portal.secretName }}
  namespace: {{ .namespace }}
  labels:
    {{- include "common.labels.labels" $ | nindent 4 }}
type: Opaque
data:
  offline_token: {{ required "Red Hat Portal 'offlineToken' Must Be Provided" .portal.offlineToken | b64enc | quote }}
  password: {{ required "Red Hat Portal 'password' Must Be Provided" .portal.password | b64enc | quote }}
  pool_id: {{ required "Red Hat Portal 'poolId' Must Be Provided" .portal.poolId | b64enc | quote }}
  username: {{ required "Red Hat Portal 'username' Must Be Provided" .portal.username | b64enc | quote }}
{{- end }}
{{- end }}
