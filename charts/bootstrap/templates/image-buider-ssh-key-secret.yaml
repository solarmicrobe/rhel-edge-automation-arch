{{- with .Values.rhsm }}
{{- if and .imageBuilder (not .imageBuilder.secretProvided) }}
{{- $sshPrivateKey := $.Files.Glob (printf "files/ssh/%s" .imageBuilder.privateKey) }}
{{- $sshPublicKey := $.Files.Glob (printf "files/ssh/%s" .imageBuilder.publicKey) }}
{{- if and ($sshPrivateKey) ($sshPublicKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .imageBuilder.secretName }}
  namespace: {{ .namespace }}
  labels:
    {{- include "common.labels.labels" $ | nindent 4 }}
type: kubernetes.io/ssh-auth
data:
  ssh-privatekey: {{ $.Files.Get (printf "files/ssh/%s" .imageBuilder.privateKey) | b64enc | quote }}
  ssh-publickey: {{ $.Files.Get (printf "files/ssh/%s" .imageBuilder.publicKey)  | b64enc | quote }}
{{- else }}
{{ fail "RHSM Entitlement Keys not Provided in `rhsm.imageBuilder.privateKey` or `rhsm.imageBuilder.publicKey` values" }}
{{- end }}
{{- end }}
{{- end }}
