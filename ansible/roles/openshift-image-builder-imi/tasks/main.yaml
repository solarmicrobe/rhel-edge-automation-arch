- name: Validate Explicit Image Builder Host
  ansible.builtin.assert:
    that:
      - image_builder_host is string
      - image_builder_host | length <= 253
      - image_builder_host is match('^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*\Z')
    fail_msg: image_builder_host must be a DNS name or IPv4 address
  when: image_builder_host | default('') | length > 0

- name: Use Explicit Image Builder Host
  ansible.builtin.add_host:
    name: pipeline_target_host
    ansible_ssh_host: "{{ image_builder_host }}"
    ansible_ssh_port: "22"
    groups:
      - builders
  when: image_builder_host | default('') | length > 0

- name: Save Explicit Image Builder Host Pipeline Result
  ansible.builtin.copy:
    content: "{{ image_builder_host }}"
    dest: "{{ image_builder_host_output_file }}"
  when:
    - image_builder_host | default('') | length > 0
    - image_builder_host_output_file is defined

- name: Discover Managed Image Builder VMs
  ansible.builtin.include_tasks: managed.yaml
  when: image_builder_host | default('') | length == 0
