argocdIntegration:
  enabled: true
  argocd:
    target:
      namespace: openshift-gitops
      project: rfe
      server: https://kubernetes.default.svc
    appProject:
      create: true
      sourceRepos:
        - https://github.com/redhat-cop/rhel-edge-automation-arch.git
      destinations:
        - namespace: rfe
          server: https://kubernetes.default.svc
        - namespace: openshift-pipelines
          server: https://kubernetes.default.svc
        - namespace: openshift-cnv
          server: https://kubernetes.default.svc
    access:
      namespaceGrants:
        create: true
        controllerServiceAccount: openshift-gitops-argocd-application-controller
        namespaces:
          - rfe
          - openshift-pipelines
          - openshift-cnv

namespace:
  namespaces:
    - name: rfe
      annotations:
        openshift.io/description: RHEL for Edge
        openshift.io/display-name: RHEL for Edge

application-manager:
  argocd:
    target:
      namespace: openshift-gitops
      project: rfe
      server: https://kubernetes.default.svc
  common:
    repoURL: https://github.com/redhat-cop/rhel-edge-automation-arch.git
    targetRevision: main
    destinationNamespace: rfe
    prune: true
    selfHeal: true
  charts:
    rfe-pipelines:
      name: rfe-pipelines
      path: charts/rfe-pipelines
      destinationNamespace: rfe
